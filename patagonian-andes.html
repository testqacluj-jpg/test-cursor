<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patagonian Andes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      text-align: center;
      padding: 3rem 1rem 1.5rem;
    }
    header h1 {
      font-size: 2.4rem;
      letter-spacing: 0.05em;
      color: #f5f5f5;
    }
    header p {
      margin-top: 0.5rem;
      font-size: 1.1rem;
      color: #a0a0b8;
      font-style: italic;
    }
    figure {
      max-width: 960px;
      width: 90%;
      margin: 1rem auto 2rem;
    }
    figure img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    }
    figcaption {
      margin-top: 0.75rem;
      text-align: center;
      font-size: 0.95rem;
      color: #8888a0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Patagonian Andes</h1>
    <p>Mount Fitz Roy &amp; Laguna de los Tres at sunrise</p>
  </header>
  <figure>
    <img src="images/patagonian-andes.jpg" alt="Mount Fitz Roy and Laguna de los Tres at sunrise, Patagonian Andes" />
    <figcaption>The granite spires of Mount Fitz Roy reflected in the glacial waters of Laguna de los Tres, El Chalt&eacute;n, Argentina.</figcaption>
  </figure>
</body>
</html>
